[package]
name = "rotelyx-cli"
description = "Rotelyx: headless harness for protocol work"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
rotelyx-core.workspace = true
rotelyx-crypto.workspace = true
rotelyx-mailbox = { path = "../rotelyx-mailbox" }
# Devices and calls, shared with the desktop window.
rotelyx-audio = { path = "../rotelyx-audio" }

rotelyx-net.workspace = true

# Naming an exit relay reads its key over HTTP, at a path the relay decides.
# Both of these are already in this binary through the transport, so this adds
# a name and no code. The path in particular must not be written twice: a relay
# serving it at one place while this asks at another is two constants that
# disagree, which is the shape of defect this project keeps finding.
rotelyx-relay-proto = { path = "../net/rotelyx-relay-proto" }
rustls = { version = "0.23", default-features = false }
reqwest = { version = "0.13", default-features = false, features = [
    "rustls-no-provider",
] }

anyhow.workspace = true
clap.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
serde_json = "1"
serde.workspace = true
postcard.workspace = true
zeroize.workspace = true
data-encoding.workspace = true
rpassword = "7"
