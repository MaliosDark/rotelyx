[package]
name = "rotelyx-core"
description = "Rotelyx L0/L1: iroh transport, identity, and framed session wire format"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[features]
# The transport is not available in a browser: it needs UDP sockets for QUIC,
# and mio does not build for wasm at all. Identity, admission control, framing
# and storage do not need it, so they stay behind this feature and a wasm build
# takes `default-features = false`.
default = ["transport"]
transport = ["dep:rotelyx-net", "tokio/rt-multi-thread", "tokio/signal"]

[dependencies]
# Key and address types only. This is the small crate at the bottom of the
# transport, with no async runtime, so it builds anywhere.
rotelyx-transport-base = { path = "../net/rotelyx-transport-base", features = ["key"] }
rotelyx-net = { workspace = true, optional = true }

blake3.workspace = true

# Sealing a circuit descriptor, which is the same hybrid construction the
# message layer uses. See `ExitRelay::seal_circuit`.
rotelyx-crypto.workspace = true
data-encoding.workspace = true
zeroize.workspace = true
subtle.workspace = true
chacha20poly1305.workspace = true
argon2.workspace = true

postcard.workspace = true
serde.workspace = true

tokio = { version = "1", default-features = false, features = ["macros", "sync", "time", "io-util"] }
futures-lite.workspace = true

anyhow.workspace = true
thiserror.workspace = true
tracing.workspace = true
getrandom.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["test-util", "rt-multi-thread", "macros", "time"] }
tracing-subscriber.workspace = true
