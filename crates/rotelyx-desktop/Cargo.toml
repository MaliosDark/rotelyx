[package]
name = "rotelyx-desktop"
description = "Rotelyx desktop client"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# Devices and calls, shared with the terminal client.
rotelyx-audio = { path = "../rotelyx-audio" }
rotelyx-core.workspace = true
rotelyx-crypto.workspace = true
rotelyx-net.workspace = true

# The phone client's transport. See `src/meeting.rs`: a desktop and a phone had
# no way to hand each other a first byte until the desktop learned to meet at a
# mailbox, which is the only place a phone can be reached.
rotelyx-wasm = { path = "../rotelyx-wasm" }
rotelyx-mailbox-client = { path = "../rotelyx-mailbox-client" }

# No Node, no bundler. The frontend is plain HTML served from `ui/`, so the
# only toolchain needed to build this is cargo.
tauri = { version = "2", features = [] }

anyhow.workspace = true
postcard.workspace = true
zeroize.workspace = true
serde = { workspace = true }
serde_json = "1"
data-encoding.workspace = true
getrandom = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "sync", "time", "io-util"] }
tracing.workspace = true
tracing-subscriber.workspace = true
rpassword = "7"
qrcode = { version = "0.14.1", default-features = false, features = ["svg"] }
