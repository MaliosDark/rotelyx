[package]
name = "rotelyx-meeting"
description = "Meeting a phone through the mailbox: the one conversation loop the desktop and the bots share."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
# The engine, not a copy of it: the same `Session` the phone and the browser
# run, so a desktop, a bot and a phone cannot disagree about what a message is.
rotelyx-wasm = { path = "../rotelyx-wasm" }
rotelyx-mailbox-client = { path = "../rotelyx-mailbox-client" }
# For the addressing bucket, which must be the same number in every client.
rotelyx-mailbox = { path = "../rotelyx-mailbox" }

# What a call needs: an identity to bind an endpoint with and a relay to route
# it through. A conversation that never calls never opens a socket.
rotelyx-core.workspace = true
rotelyx-net.workspace = true
rotelyx-audio = { path = "../rotelyx-audio" }

anyhow.workspace = true
serde = { workspace = true }
serde_json = "1"
data-encoding.workspace = true
getrandom = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "sync", "time"] }
tracing.workspace = true
zeroize.workspace = true

[dev-dependencies]
tracing-subscriber.workspace = true
