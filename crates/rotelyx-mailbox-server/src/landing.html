<style>
/* The page a person opens to ask one question: is it up.
   Everything past that belongs in the operator's log and not on a URL anybody
   can poll. An earlier version carried a table of what the operator can
   observe and a row of counters; the table published our own analysis of our
   own weaknesses, and the counters were one poll a minute away from being a
   feed of when a community is awake and roughly how large it is.

   The animation behind the panel is decorative and says nothing: the strands
   and the envelopes crossing them are random and have no connection to any
   traffic this host is carrying. That is deliberate. A "live" visualisation of
   real deposits would be exactly the feed the counters were removed for. */
:root{
  --bg:#08070c;
  --panel:rgba(20,17,28,.70);
  --panel2:rgba(16,13,22,.44);
  --ink:#f4f0ff;
  --dim:#aaa2b9;
  --rule:rgba(255,255,255,.10);
  --accent:#8b5cf6;
  --violet:#8b5cf6;
  --cyan:#42e8ff;
  --pink:#ff4fd8;
  --amber:#ffba52;
}

  background:

  font:15px/1.65 system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  display:flex;align-items:center;justify-content:center;padding:34px;
}

/* The identity seal, top right of the panel. It states the name this mailbox
   was given, so a person can cross the name
   they expected against the one the server states, beside the URL in the bar.
   It is a convenience for a human, not proof: what proves a mailbox genuine is
   the certificate, the domain and the app's safety numbers, none of which a
   copied badge can forge. The holographic sheen is decoration and says nothing.*/
.seal{
  position:absolute;top:16px;right:18px;z-index:4;
  display:inline-flex;align-items:center;gap:9px;
  padding:7px 12px 7px 9px;border-radius:13px;
  border:1px solid rgba(139,92,246,.34);
  background:linear-gradient(135deg,rgba(40,32,60,.72),rgba(18,15,26,.62));
  box-shadow:inset 0 1px 0 rgba(255,255,255,.07),0 6px 20px rgba(0,0,0,.30);
  overflow:hidden;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);
}
.seal-holo{
  position:absolute;inset:0;pointer-events:none;opacity:.5;mix-blend-mode:screen;
  background:linear-gradient(115deg,transparent 20%,rgba(66,232,255,.45) 38%,rgba(139,92,246,.5) 50%,rgba(255,79,216,.4) 62%,transparent 80%);
  background-size:280% 100%;animation:holo 5.5s linear infinite;
}
@keyframes holo{to{background-position:-280% 0}}
.seal-shield{width:24px;height:24px;flex:0 0 24px;position:relative;
  filter:drop-shadow(0 0 7px rgba(139,92,246,.55))}
.seal-shield path{fill:rgba(139,92,246,.30);stroke:#b99bff;stroke-width:1.4;
  stroke-linejoin:round}
.seal-shield .seal-check{fill:none;stroke:#5cffd0;stroke-width:2.1;
  stroke-linecap:round;stroke-linejoin:round}
.seal-name{position:relative;font:700 .92rem ui-monospace,SFMono-Regular,Menlo,monospace;
  letter-spacing:.01em;color:#f4f0ff;text-shadow:0 0 12px rgba(139,92,246,.4)}
@media(max-width:650px){
  .seal{position:static;margin:0 0 16px;max-width:100%}
}
@media(prefers-reduced-motion:reduce){.seal-holo{animation:none;opacity:.32}}
/*STATUS-STYLE*/
/* The status block above is rendered by `rotelyx-status`, which is shared with
   the relay's page and keeps its own palette. These few lines sit it on this
   ground without touching that crate, so the relay is unaffected. */
.status{color:var(--ink)}

/* The level classes -- `up`, `busy`, `strained` -- are written for the bars,
   and the headline row carries one too (`class="status busy"`). On the old
   ground that painted the whole row a solid block, which reads as a banner
   rather than as a state. The dot already carries the colour, so the row keeps
   its own background here. */
.status.up,.status.busy,.status.strained,.status.down{background:transparent;height:auto}

.bars{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.07);
      border-radius:8px;padding:4px 5px;height:42px;overflow:hidden}
.unknown{background:rgba(255,255,255,.06)}
.legend,.scale,.note{color:#8f86a0}

/* Ninety six half hours at two pixels apiece with a two pixel gap is wider
   than a phone, and the strip ran out of the panel and off the screen. Nothing
   is dropped: the bars and the gaps are simply thinner where there is less
   room, so the whole two days stay visible. */
@media(max-width:650px){
  .bars{gap:1px;padding:4px}
  .bars i{min-width:1px}
}
@media(max-width:650px){body{padding:18px}main{padding:27px 23px 24px;border-radius:23px}.topline{gap:14px}.mark{width:56px;height:56px;flex-basis:56px}}
@media(prefers-reduced-motion:reduce){.mark{animation:none}}
</style></head><body>
<canvas id="fx" aria-hidden="true"></canvas>
<div class="noise" aria-hidden="true"></div>
<div class="vignette" aria-hidden="true"></div>
<main>
  <!--MAILBOX-SEAL-->
  <div class="topline">
    <div class="mark" aria-hidden="true"></div>
    <div class="titlewrap">
      <p class="tag">Blind mailbox</p>
      <h1>Rotelyx Mailbox</h1>
    </div>
  </div>

  <div class="copy">
    <p>
      This host holds sealed envelopes until somebody asks for them. It
      <strong>holds no keys</strong> and cannot read a byte of what it stores.
    </p>
  </div>

  <div class="status-shell">
    <!--STATUS-->
  </div>

  <footer>Rotelyx &middot; internally audited</footer>
</main>
<script>
(() => {
  const canvas = document.getElementById('fx');
  const ctx = canvas.getContext('2d', { alpha: true });
  const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
  let W=0,H=0,DPR=1,cx=0,cy=0;
  let mouseX=0,mouseY=0,targetMX=0,targetMY=0;
  const COLORS=['#8b5cf6','#42e8ff','#ff4fd8','#ffba52','#7c6cff','#49ffc7'];
  const strands=[];
  const packets=[];
  const rings=[];
  const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
  const lerp=(a,b,t)=>a+(b-a)*t;
  const ease=t=>t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2;
  function hexAlpha(hex,a){
    const n=parseInt(hex.slice(1),16),r=n>>16,g=(n>>8)&255,b=n&255;
    return `rgba(${r},${g},${b},${a})`;
  }

  // Everything that glows is drawn once into a small canvas and then stamped.
  //
  // The first version asked the canvas for `shadowBlur` on every strand, every
  // ring and every envelope: about seventy blurred draws a frame, which a
  // browser does on the CPU. Measured headless it ran at 15.8 frames a second
  // and he could see it stutter. A blurred dot is the same blurred dot every
  // time, so it is painted once and copied, which is a memory read instead of
  // a convolution. Same picture, no blur in the loop.
  const glows = new Map();
  function glowSprite(color){
    let s = glows.get(color);
    if (s) return s;
    const size = 64;
    s = document.createElement('canvas');
    s.width = s.height = size;
    const g = s.getContext('2d');
    const grad = g.createRadialGradient(size/2,size/2,0,size/2,size/2,size/2);
    grad.addColorStop(0, hexAlpha(color,.95));
    grad.addColorStop(.35, hexAlpha(color,.30));
    grad.addColorStop(1, hexAlpha(color,0));
    g.fillStyle = grad;
    g.fillRect(0,0,size,size);
    glows.set(color, s);
    return s;
  }

  // The dust and the light in the middle, painted once at window size.
  //
  // Both are still pictures: the dust never moves except with the pointer, and
  // the glow in the middle never changes at all. Drawing them each frame meant
  // a hundred arcs and a full-screen gradient fill sixty times a second, which
  // in a browser without a GPU is most of the frame. Now it is one copy.
  let dust = null;
  function makeDust(){
    dust = document.createElement('canvas');
    dust.width = Math.max(1, Math.round(W));
    dust.height = Math.max(1, Math.round(H));
    const g = dust.getContext('2d');

    const glow = g.createRadialGradient(cx,cy,0,cx,cy,Math.min(W,H)*.34);
    glow.addColorStop(0,'rgba(126,73,255,.23)');
    glow.addColorStop(.16,'rgba(65,229,255,.085)');
    glow.addColorStop(.4,'rgba(255,79,216,.055)');
    glow.addColorStop(1,'rgba(0,0,0,0)');
    g.fillStyle = glow;
    g.fillRect(0,0,W,H);

    const count = W < 700 ? 55 : 110;
    for (let i=0;i<count;i++){
      const r = Math.random()*1.35+.25;
      g.fillStyle = `rgba(210,200,255,${Math.random()*.45+.08})`;
      g.beginPath();
      g.arc(Math.random()*W, Math.random()*H, r, 0, 6.283);
      g.fill();
    }
  }

  function resize(){
    // One and a half rather than two: the difference is invisible on this
    // picture and it is a third fewer pixels to fill every frame.
    DPR=Math.min(devicePixelRatio||1,1.5);
    W=innerWidth;H=innerHeight;cx=W*.5;cy=H*.51;
    canvas.width=Math.round(W*DPR);canvas.height=Math.round(H*DPR);
    canvas.style.width=W+'px';canvas.style.height=H+'px';ctx.setTransform(DPR,0,0,DPR,0,0);
    init();
  }
  function init(){
    strands.length=0; packets.length=0; rings.length=0;
    makeDust();
    const count=W<700?7:10;
    for(let i=0;i<count;i++){
      const side=i%2===0?-1:1;
      strands.push({
        side,
        color:COLORS[i%COLORS.length],
        lane:(i-count/2)*18 + (Math.random()-.5)*70,
        amp:36+Math.random()*76,
        speed:.35+Math.random()*.8,
        phase:Math.random()*Math.PI*2,
        width:.8+Math.random()*1.45,
        z:.4+Math.random()*.85
      });
    }
    const pcount=W<700?16:26;
    for(let i=0;i<pcount;i++) packets.push(makePacket(i));
    for(let i=0;i<5;i++) rings.push({r:68+i*23,phase:i*.9,color:COLORS[(i+1)%COLORS.length]});
  }
  function makePacket(i){
    const inbound=Math.floor(Math.random()*strands.length);
    let outbound=Math.floor(Math.random()*strands.length);
    if(outbound===inbound) outbound=(outbound+1)%strands.length;
    return {
      inbound,outbound,
      t:Math.random(),
      speed:.000055+Math.random()*.000095,
      color:COLORS[(i+Math.floor(Math.random()*COLORS.length))%COLORS.length],
      size:2.5+Math.random()*3.4,
      trail:6+Math.floor(Math.random()*5)
    };
  }
  function strandPoint(s,u,time){
    // This is the single source of truth for BOTH the visible route and packets.
    // u=0 is the outer edge, u=1 is the mailbox core.
    const start=s.side<0?-80:W+80;
    const q=ease(u);
    let x=lerp(start,cx,q);
    const base=cy+s.lane;
    const wave=Math.sin(u*12+s.phase+time*.001*s.speed)*s.amp*(1-u*.72);
    let y=lerp(base,cy,q)+wave;

    // Tighten the last section into the core while retaining the strand's twist.
    const pull=Math.pow(clamp((u-.60)/.40,0,1),1.45);
    const ang=s.phase+time*.0014*s.speed+u*10*s.side;
    const orbit=(1-pull)*34;
    x += Math.cos(ang)*orbit*pull*.55;
    y += Math.sin(ang)*orbit*pull*.42;

    // Guarantee every rendered line and every packet meet at exactly the same point.
    const lock=Math.pow(clamp((u-.88)/.12,0,1),2);
    x=lerp(x,cx,lock);
    y=lerp(y,cy,lock);
    return {x,y};
  }
  function packetPoint(p,t,time){
    // First half: edge -> mailbox on the inbound strand.
    // Second half: mailbox -> edge on the outbound strand.
    if(t<=.5){
      const u=t*2;
      return strandPoint(strands[p.inbound],u,time);
    }
    const u=(1-t)*2;
    return strandPoint(strands[p.outbound],u,time);
  }
  function drawBackdrop(t){
    ctx.clearRect(0,0,W,H);
    if(dust){
      ctx.save();
      ctx.globalAlpha=.80+.20*Math.sin(t*.0004);
      ctx.drawImage(dust, mouseX*6, mouseY*5);
      ctx.restore();
    }
  }
  function drawStrands(time){
    ctx.save();ctx.globalCompositeOperation='lighter';
    for(const s of strands){
      const steps=Math.max(34,Math.floor(W/28));
      // Three passes, wide and faint to narrow and bright. That is the glow:
      // no blur is asked for, and at these alphas the eye cannot tell.
      // Two passes rather than three. The widest one covered the screen in a
      // twelve pixel band at four per cent opacity, which is a great many
      // pixels for something nobody can point to; what reads as glow is the
      // middle pass under the bright line.
      const path=new Path2D();
      for(let i=0;i<=steps;i++){
        const pt=strandPoint(s,i/steps,time);
        if(i===0)path.moveTo(pt.x,pt.y);else path.lineTo(pt.x,pt.y);
      }
      ctx.strokeStyle=hexAlpha(s.color,.16);
      ctx.lineWidth=6*s.z;
      ctx.stroke(path);
      ctx.strokeStyle=hexAlpha(s.color,.5);
      ctx.lineWidth=Math.max(1.05,s.width*s.z);
      ctx.stroke(path);
    }
    ctx.restore();
  }
  function drawCore(time){
    ctx.save();ctx.translate(cx,cy);ctx.globalCompositeOperation='lighter';
    rings.forEach((r,i)=>{
      const pulse=1+Math.sin(time*.0013+r.phase)*.04;
      ctx.save();ctx.rotate(time*.00016*(i%2?1:-1)+r.phase);
      ctx.scale(1,.42+Math.sin(r.phase+time*.0004)*.07);
      ctx.beginPath();ctx.arc(0,0,r.r*pulse,0,6.283);
      ctx.strokeStyle=hexAlpha(r.color,.11+i*.02);ctx.lineWidth=1.2;ctx.stroke();ctx.restore();
    });
    // The shell, stamped from the sprite instead of five gradients a frame.
    const shell=glowSprite('#8b5cf6');
    const size=110+Math.sin(time*.0017)*8;
    ctx.globalAlpha=.55;
    ctx.drawImage(shell,-size/2,-size/2,size,size);
    ctx.globalAlpha=1;
    for(let i=0;i<12;i++){
      const a=i/12*6.283+time*.001*(i%2?1:-1);const rr=26+(i%6)*7;
      ctx.fillStyle=hexAlpha(COLORS[i%COLORS.length],.45);
      ctx.beginPath();ctx.arc(Math.cos(a)*rr,Math.sin(a)*rr*.7,1+(i%3)*.45,0,6.283);ctx.fill();
    }
    ctx.restore();
  }
  function drawPackets(time,dt){
    ctx.save();ctx.globalCompositeOperation='lighter';
    for(const p of packets){
      p.t += p.speed*dt;
      if(p.t>1){Object.assign(p,makePacket(Math.floor(Math.random()*999)));p.t=0;}

      // Trail samples the SAME route as the packet. No free-floating particles.
      for(let k=p.trail;k>=1;k--){
        const tt=p.t-k*.0075;
        if(tt<=0)continue;
        const pt=packetPoint(p,tt,time);
        const f=1-k/(p.trail+1);
        ctx.fillStyle=hexAlpha(p.color,f*.30);
        ctx.beginPath();ctx.arc(pt.x,pt.y,p.size*.42*f,0,6.283);ctx.fill();
      }

      const pt=packetPoint(p,p.t,time);
      const ahead=packetPoint(p,clamp(p.t+.003,0,1),time);
      const angle=Math.atan2(ahead.y-pt.y,ahead.x-pt.x);

      // The halo: one stamp of the sprite, where the blur used to be.
      const halo=glowSprite(p.color);
      const hs=p.size*7;
      ctx.drawImage(halo,pt.x-hs/2,pt.y-hs/2,hs,hs);

      ctx.save();ctx.translate(pt.x,pt.y);ctx.rotate(angle);
      const pulse=.92+Math.sin(p.t*Math.PI)*.18;
      const w=p.size*2.25*pulse,h=p.size*1.45*pulse;
      ctx.fillStyle=hexAlpha(p.color,.98);
      ctx.beginPath();
      // `roundRect` is recent enough that a browser without it should still
      // get the page rather than a dead canvas and a console error.
      if(ctx.roundRect) ctx.roundRect(-w/2,-h/2,w,h,Math.max(1,p.size*.35));
      else ctx.rect(-w/2,-h/2,w,h);
      ctx.fill();
      ctx.strokeStyle='rgba(255,255,255,.82)';ctx.lineWidth=.55;
      ctx.beginPath();ctx.moveTo(-w*.38,-h*.18);ctx.lineTo(0,h*.16);ctx.lineTo(w*.38,-h*.18);ctx.stroke();
      ctx.restore();
    }
    ctx.restore();
  }
  let last=performance.now();
  function frame(now){
    const dt=Math.min(40,now-last);last=now;
    mouseX=lerp(mouseX,targetMX,.04);mouseY=lerp(mouseY,targetMY,.04);
    drawBackdrop(now);drawStrands(now);drawCore(now);drawPackets(now,dt);
    requestAnimationFrame(frame);
  }
  function still(){
    // Reduced motion is a setting somebody turned on for a reason, and a
    // full-screen animation is the first thing they turned it on for. One
    // frame, drawn once: the page keeps its picture and nothing moves.
    drawBackdrop(0);drawStrands(0);drawCore(0);drawPackets(0,0);
  }
  addEventListener('pointermove',e=>{targetMX=(e.clientX/W-.5)*2;targetMY=(e.clientY/H-.5)*2},{passive:true});
  addEventListener('resize',()=>{resize();if(reduced)still();},{passive:true});
  resize();
  if(reduced) still(); else requestAnimationFrame(frame);
})();
</script>
</body></html>
