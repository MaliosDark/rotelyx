# See Cargo.toml.orig for the original contents.

[package]
edition = "2024"
rust-version = "1.91"
name = "rotelyx-transport"
version = "1.0.3"
authors = [
    "dignifiedquire <me@dignifiedquire.com>",
    "n0 team",
]
build = "build.rs"
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "Rotelyx transport: QUIC endpoints dialled by public key"
keywords = [
    "quic",
    "networking",
    "holepunching",
    "p2p",
]
license = "(MIT OR Apache-2.0) AND BSD-3-Clause"
repository = "https://github.com/MaliosDark/rotelyx"
resolver = "2"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = [
    "--cfg",
    "rotelyx_docsrs",
]

[package.metadata.cargo_check_external_types]
allowed_external_types = [
    "rotelyx_transport_base::*",
    "rotelyx_discovery::*",
    "rotelyx_relay_proto::*",
    "rotelyx_metrics::*",
    "rotelyx_error::*",
    "rotelyx_watcher::*",
    "rotelyx_quic::*",
    "rotelyx_quic_proto::*",
    "rotelyx_quic_udp::*",
    "bytes::*",
    "http::*",
    "serde_core::*",
    "tokio::*",
    "url::*",
    "rustls::*",
    "futures_core::stream::Stream",
    "futures_lite::stream::Boxed",
]

[features]
default = [
    "metrics",
    "fast-apple-datapath",
    "portmapper",
    "tls-ring",
]
fast-apple-datapath = ["rotelyx-quic/fast-apple-datapath"]
metrics = [
    "rotelyx-metrics/metrics",
    "rotelyx-relay-proto/metrics",
]
platform-verifier = ["rotelyx-relay-proto/platform-verifier"]
portmapper = ["dep:portmapper"]
qlog = ["rotelyx-quic/qlog"]
test-utils = [
    "rotelyx-relay-proto/test-utils",
    "rotelyx-relay-proto/server",
    "dep:axum",
]
tls-aws-lc-rs = [
    "rotelyx-quic/aws-lc-rs",
    "rotelyx-relay-proto/tls-aws-lc-rs",
    "rotelyx-discovery/tls-aws-lc-rs",
]
tls-ring = [
    "rotelyx-quic/ring",
    "rotelyx-relay-proto/tls-ring",
    "rotelyx-discovery/tls-ring",
]
unstable-custom-transports = []
unstable-net-report = []

[lib]
name = "rotelyx_transport"
# Vendored upstream shipped a cdylib here for C consumers. Nothing in Rotelyx
# links this as a C library, and building both a rlib and a cdylib from one lib
# target makes them collide on one output filename under `cargo test
# --workspace`: whichever lands last wins and the other crates are then told the
# crate cannot be found.
crate-type = ["lib"]
path = "src/lib.rs"

