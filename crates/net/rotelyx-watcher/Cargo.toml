[workspace]

# THIS FILE IS AUTOMATICALLY GENERATED BY CARGO
#
# When uploading crates to the registry Cargo will automatically
# "normalize" Cargo.toml files for maximal compatibility
# with all versions of Cargo and also rewrite `path` dependencies
# to registry (e.g., crates.io) dependencies.
#
# If you are reading this file be aware that the original Cargo.toml
# will likely look very different (and much more reasonable).
# See Cargo.toml.orig for the original contents.

[package]
edition = "2021"
rust-version = "1.91"
name = "rotelyx-watcher"
version = "1.0.0"
authors = [
    "dignifiedquire <me@dignifiedquire.com>",
    "n0 team",
]
build = false
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "Rotelyx transport: change notification"
keywords = [
    "async",
    "watcher",
]
license = "MIT OR Apache-2.0"
repository = "https://github.com/MaliosDark/rotelyx"

[lib]
name = "rotelyx_watcher"
path = "src/lib.rs"

[dependencies.derive_more]
version = "2.0.1"
features = ["debug"]

[dependencies.rotelyx-error]
package = "rotelyx-error"
path = "../rotelyx-error"

[dependencies.rotelyx-future]
package = "rotelyx-future"
path = "../rotelyx-future"

[dev-dependencies.rand]
version = "0.10"

[dev-dependencies.tokio]
version = "1"
features = [
    "macros",
    "sync",
    "rt-multi-thread",
    "time",
    "test-util",
]

[dev-dependencies.tokio-util]
version = "0.7"
features = [
    "io-util",
    "io",
    "rt",
]

[target.'cfg(all(target_family = "wasm", target_os = "unknown"))'.dependencies]

[target.'cfg(not(all(target_family = "wasm", target_os = "unknown")))'.dependencies]

[lints.clippy]
unused-async = "warn"

[lints.rust]
missing_debug_implementations = "warn"

[lints.rust.unexpected_cfgs]
level = "warn"
priority = 0
check-cfg = [
    "cfg(watcher_docsrs)",
    "cfg(watcher_loom)",
]

[profile.dev-ci]
opt-level = 1
inherits = "dev"

[profile.release]
debug = 2
