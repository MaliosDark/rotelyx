<style>
/* The page a person opens to ask one question: is it up.

   It is the mailbox's page with one motif changed, and deliberately so: an
   operator running both should see two rooms of one building rather than two
   products. The stylesheet is the same file's, kept in step by hand; if this
   ever grows a third page it belongs in `rotelyx-status` beside the strip.

   What differs is what the animation says. The mailbox draws strands ending in
   a core, because a mailbox holds things. A relay holds nothing: here the
   strands cross and leave by the other side, and there is no core to hold
   anything in. Both are decoration and neither is measured -- an animation of
   real traffic would be a live feed of when a community is awake, which is the
   reason this page carries no counters either. */
:root{
  --bg:#08070c;
  --panel:rgba(20,17,28,.70);
  --panel2:rgba(16,13,22,.44);
  --ink:#f4f0ff;
  --dim:#aaa2b9;
  --rule:rgba(255,255,255,.10);
  --accent:#8b5cf6;
  --violet:#8b5cf6;
  --cyan:#42e8ff;
  --pink:#ff4fd8;
  --amber:#ffba52;
}
*{box-sizing:border-box}
html,body{width:100%;min-height:100%}
body{
  margin:0;min-height:100vh;overflow-x:hidden;
  background:
    radial-gradient(900px 650px at 50% 52%, rgba(106,49,238,.13), transparent 72%),
    radial-gradient(700px 520px at 14% 30%, rgba(66,232,255,.065), transparent 72%),
    radial-gradient(750px 560px at 86% 68%, rgba(255,79,216,.06), transparent 72%),
    var(--bg);
  color:var(--ink);
  font:15px/1.65 system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  display:flex;align-items:center;justify-content:center;padding:34px;
}
#fx{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
.noise{position:fixed;inset:0;z-index:1;pointer-events:none;opacity:.17;mix-blend-mode:soft-light;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.95' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.14'/%3E%3C/svg%3E")}
.vignette{position:fixed;inset:0;z-index:1;pointer-events:none;background:radial-gradient(circle at 50% 50%,transparent 25%,rgba(5,4,8,.18) 63%,rgba(5,4,8,.72) 100%)}
main{
  position:relative;z-index:3;max-width:610px;width:100%;
  padding:36px 38px 30px;
  border:1px solid rgba(255,255,255,.10);
  border-radius:28px;
  background:linear-gradient(145deg,rgba(30,25,42,.74),rgba(13,11,18,.64));
  box-shadow:
    0 28px 90px rgba(0,0,0,.46),
    inset 0 1px 0 rgba(255,255,255,.08),
    0 0 0 1px rgba(121,82,255,.025);
  backdrop-filter:blur(22px) saturate(140%);
  -webkit-backdrop-filter:blur(22px) saturate(140%);
}
main:before{
  content:"";position:absolute;inset:-1px;border-radius:inherit;padding:1px;pointer-events:none;
  background:linear-gradient(130deg,rgba(66,232,255,.24),rgba(139,92,246,.30) 28%,rgba(255,79,216,.12) 58%,rgba(255,186,82,.19));

/*STATUS-STYLE*/
/* The status block above is rendered by `rotelyx-status`, which is shared with
   the relay's page and keeps its own palette. These few lines sit it on this
   ground without touching that crate, so the relay is unaffected. */
.status{color:var(--ink)}

/* The level classes -- `up`, `busy`, `strained` -- are written for the bars,
   and the headline row carries one too (`class="status busy"`). On the old
   ground that painted the whole row a solid block, which reads as a banner
   rather than as a state. The dot already carries the colour, so the row keeps
   its own background here. */
.status.up,.status.busy,.status.strained,.status.down{background:transparent;height:auto}

.bars{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.07);
      border-radius:8px;padding:4px 5px;height:42px;overflow:hidden}
.unknown{background:rgba(255,255,255,.06)}
.legend,.scale,.note{color:#8f86a0}

/* Ninety six half hours at two pixels apiece with a two pixel gap is wider
   than a phone, and the strip ran out of the panel and off the screen. Nothing
   is dropped: the bars and the gaps are simply thinner where there is less
   room, so the whole two days stay visible. */
@media(max-width:650px){
  .bars{gap:1px;padding:4px}
  .bars i{min-width:1px}
}
@media(max-width:650px){body{padding:18px}main{padding:27px 23px 24px;border-radius:23px}.topline{gap:14px}.mark{width:56px;height:56px;flex-basis:56px}}
@media(prefers-reduced-motion:reduce){.mark{animation:none}}
</style></head><body>
<canvas id="fx" aria-hidden="true"></canvas>
<div class="noise" aria-hidden="true"></div>
<div class="vignette" aria-hidden="true"></div>
<main>
  <div class="topline">
    <div class="mark" aria-hidden="true"></div>
    <div class="titlewrap">
      <p class="tag">Relay</p>
      <h1>Rotelyx Relay</h1>
    </div>
  </div>

  <div class="copy">
    <p>
      This host forwards encrypted traffic between peers that cannot reach each
      other directly. It <strong>holds no keys</strong> and cannot read what
      passes through it.
    </p>
  </div>

  <div class="status-shell">
    <!--STATUS-->
  </div>

  <footer>Rotelyx &middot; pre-release &middot; internally audited</footer>
</main>
<script>
(() => {
  const canvas = document.getElementById('fx');
  const ctx = canvas.getContext('2d', { alpha: true });
  const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
  let W=0,H=0,DPR=1,cx=0,cy=0;
  let mouseX=0,mouseY=0,targetMX=0,targetMY=0;
  const COLORS=['#8b5cf6','#42e8ff','#ff4fd8','#ffba52','#7c6cff','#49ffc7'];
  const strands=[];
  const packets=[];
  const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
  const lerp=(a,b,t)=>a+(b-a)*t;
  const ease=t=>t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2;
  function hexAlpha(hex,a){
    const n=parseInt(hex.slice(1),16),r=n>>16,g=(n>>8)&255,b=n&255;
    return `rgba(${r},${g},${b},${a})`;
  }

  // Everything that glows is drawn once into a small canvas and then stamped.
  // Asking the canvas for `shadowBlur` per stroke means a blur of a full-screen
  // layer per stroke, which a browser without a GPU does on the processor and
  // which cost this picture most of its frame. A blurred dot is the same
  // blurred dot every time, so it is painted once and copied.
  const glows = new Map();
  function glowSprite(color){
    let s = glows.get(color);
    if (s) return s;
    const size = 64;
    s = document.createElement('canvas');
    s.width = s.height = size;
    const g = s.getContext('2d');
    const grad = g.createRadialGradient(size/2,size/2,0,size/2,size/2,size/2);
    grad.addColorStop(0, hexAlpha(color,.95));
    grad.addColorStop(.35, hexAlpha(color,.30));
    grad.addColorStop(1, hexAlpha(color,0));
    g.fillStyle = grad;
    g.fillRect(0,0,size,size);
    glows.set(color, s);
    return s;
  }

  // The dust and the light in the middle: two still pictures, painted once at
  // window size and copied rather than redrawn.
  let dust = null;
  function makeDust(){
    dust = document.createElement('canvas');
    dust.width = Math.max(1, Math.round(W));
    dust.height = Math.max(1, Math.round(H));
    const g = dust.getContext('2d');

    const glow = g.createRadialGradient(cx,cy,0,cx,cy,Math.min(W,H)*.36);
    glow.addColorStop(0,'rgba(126,73,255,.20)');
    glow.addColorStop(.18,'rgba(65,229,255,.075)');
    glow.addColorStop(.44,'rgba(255,79,216,.05)');
    glow.addColorStop(1,'rgba(0,0,0,0)');
    g.fillStyle = glow;
    g.fillRect(0,0,W,H);

    const count = W < 700 ? 55 : 110;
    for (let i=0;i<count;i++){
      const r = Math.random()*1.35+.25;
      g.fillStyle = `rgba(210,200,255,${Math.random()*.45+.08})`;
      g.beginPath();
      g.arc(Math.random()*W, Math.random()*H, r, 0, 6.283);
      g.fill();
    }
  }

  function resize(){
    // One and a half rather than two: the difference is invisible on this
    // picture and it is a third fewer pixels to fill every frame.
    DPR=Math.min(devicePixelRatio||1,1.5);
    W=innerWidth;H=innerHeight;cx=W*.5;cy=H*.51;
    canvas.width=Math.round(W*DPR);canvas.height=Math.round(H*DPR);
    canvas.style.width=W+'px';canvas.style.height=H+'px';ctx.setTransform(DPR,0,0,DPR,0,0);
    init();
  }
  function init(){
    strands.length=0; packets.length=0;
    makeDust();
    const count=W<700?8:12;
    for(let i=0;i<count;i++){
      const side=i%2===0?-1:1;
      strands.push({
        side,
        color:COLORS[i%COLORS.length],
        lane:(i-count/2)*20 + (Math.random()-.5)*74,
        amp:34+Math.random()*74,
        speed:.22+Math.random()*.5,
        phase:Math.random()*Math.PI*2,
        width:.8+Math.random()*1.4,
        z:.4+Math.random()*.85
      });
    }
    const pcount=W<700?14:24;
    for(let i=0;i<pcount;i++) packets.push(makePacket(i));
  }
  function makePacket(i){
    // In on one link and out on another: that is the whole of what a relay
    // does, and it is the only thing this picture says.
    const inbound=Math.floor(Math.random()*strands.length);
    let outbound=Math.floor(Math.random()*strands.length);
    if(strands[outbound].side===strands[inbound].side){
      outbound=(outbound+1)%strands.length;
    }
    return {
      inbound,outbound,
      t:Math.random(),
      speed:.00004+Math.random()*.00006,
      color:COLORS[(i+Math.floor(Math.random()*COLORS.length))%COLORS.length],
      size:2.4+Math.random()*3.2,
      trail:6+Math.floor(Math.random()*5)
    };
  }
  function strandPoint(s,u,time){
    // One source of truth for the visible line and for what travels on it.
    // u=0 is the outer edge this strand comes in from, u=1 is the crossing.
    const start=s.side<0?-80:W+80;
    const q=ease(u);
    let x=lerp(start,cx,q);
    const base=cy+s.lane;
    const wave=Math.sin(u*12+s.phase+time*.001*s.speed)*s.amp*(1-u*.72);
    let y=lerp(base,cy,q)+wave;

    // The strands narrow towards the crossing without closing on a point: a
    // relay is a place traffic passes, not a place it collects, so they meet
    // in a seam rather than in a core.
    const pull=Math.pow(clamp((u-.55)/.45,0,1),1.3);
    const ang=s.phase+time*.0009*s.speed+u*8*s.side;
    x += Math.cos(ang)*30*(1-pull)*pull*.6;
    y += Math.sin(ang)*30*(1-pull)*pull*.45;

    const lock=Math.pow(clamp((u-.86)/.14,0,1),2);
    x=lerp(x,cx,lock);
    y=lerp(y,cy+s.lane*.08,lock);
    return {x,y};
  }
  function packetPoint(p,t,time){
    if(t<=.5) return strandPoint(strands[p.inbound],t*2,time);
    return strandPoint(strands[p.outbound],(1-t)*2,time);
  }
  function drawBackdrop(t){
    ctx.clearRect(0,0,W,H);
    if(dust){
      ctx.save();
      ctx.globalAlpha=.80+.20*Math.sin(t*.0004);
      ctx.drawImage(dust, mouseX*6, mouseY*5);
      ctx.restore();
    }
  }
  function drawStrands(time){
    ctx.save();ctx.globalCompositeOperation='lighter';
    for(const s of strands){
      const steps=Math.max(34,Math.floor(W/28));
      // Two passes, wide and faint under narrow and bright. That is the glow:
      // no blur is asked for and at these alphas the eye cannot tell.
      const path=new Path2D();
      for(let i=0;i<=steps;i++){
        const pt=strandPoint(s,i/steps,time);
        if(i===0)path.moveTo(pt.x,pt.y);else path.lineTo(pt.x,pt.y);
      }
      ctx.strokeStyle=hexAlpha(s.color,.16);
      ctx.lineWidth=6*s.z;
      ctx.stroke(path);
      ctx.strokeStyle=hexAlpha(s.color,.5);
      ctx.lineWidth=Math.max(1.05,s.width*s.z);
      ctx.stroke(path);
    }
    ctx.restore();
  }
  function drawSeam(time){
    // Where the strands cross. The mailbox has a lit core here because it
    // holds what arrives; this is a seam with nothing inside it.
    ctx.save();ctx.translate(cx,cy);ctx.globalCompositeOperation='lighter';
    const h=Math.min(H*.36,300)+Math.sin(time*.0009)*10;
    const seam=ctx.createLinearGradient(0,-h,0,h);
    seam.addColorStop(0,'rgba(139,92,246,0)');
    seam.addColorStop(.5,'rgba(190,160,255,.30)');
    seam.addColorStop(1,'rgba(66,232,255,0)');
    ctx.fillStyle=seam;
    ctx.fillRect(-1.1,-h,2.2,h*2);
    for(let i=0;i<3;i++){
      const w=(46+i*40)*(1+.05*Math.sin(time*.0012+i));
      ctx.strokeStyle=hexAlpha(COLORS[(i+1)%COLORS.length],.10-i*.02);
      ctx.lineWidth=1.1;
      ctx.beginPath();
      ctx.ellipse(0,0,w*.34,h*(.5+i*.12),0,0,6.283);
      ctx.stroke();
    }
    ctx.restore();
  }
  function drawPackets(time,dt){
    ctx.save();ctx.globalCompositeOperation='lighter';
    for(const p of packets){
      p.t += p.speed*dt;
      if(p.t>1){Object.assign(p,makePacket(Math.floor(Math.random()*999)));p.t=0;}

      // The trail samples the same route as the packet: nothing floats free.
      for(let k=p.trail;k>=1;k--){
        const tt=p.t-k*.0075;
        if(tt<=0)continue;
        const pt=packetPoint(p,tt,time);
        const f=1-k/(p.trail+1);
        ctx.fillStyle=hexAlpha(p.color,f*.30);
        ctx.beginPath();ctx.arc(pt.x,pt.y,p.size*.42*f,0,6.283);ctx.fill();
      }

      const pt=packetPoint(p,p.t,time);
      const ahead=packetPoint(p,clamp(p.t+.003,0,1),time);
      const angle=Math.atan2(ahead.y-pt.y,ahead.x-pt.x);

      // Brightest as it crosses, and gone out the other side.
      const cross=1+Math.exp(-Math.pow((p.t-.5)/.055,2))*1.4;
      const halo=glowSprite(p.color);
      const hs=p.size*7*cross;
      ctx.drawImage(halo,pt.x-hs/2,pt.y-hs/2,hs,hs);

      ctx.save();ctx.translate(pt.x,pt.y);ctx.rotate(angle);
      const w=p.size*2.2,h=p.size*1.4;
      ctx.fillStyle=hexAlpha(p.color,.98);
      ctx.beginPath();
      // `roundRect` is recent enough that a browser without it should still
      // get the page rather than a dead canvas and an error in the console.
      if(ctx.roundRect) ctx.roundRect(-w/2,-h/2,w,h,Math.max(1,p.size*.35));
      else ctx.rect(-w/2,-h/2,w,h);
      ctx.fill();
      ctx.restore();
    }
    ctx.restore();
  }
  let last=performance.now();
  function frame(now){
    const dt=Math.min(40,now-last);last=now;
    mouseX=lerp(mouseX,targetMX,.04);mouseY=lerp(mouseY,targetMY,.04);
    drawBackdrop(now);drawStrands(now);drawSeam(now);drawPackets(now,dt);
    requestAnimationFrame(frame);
  }
  function still(){
    // Reduced motion is a setting somebody turned on for a reason, and a
    // full-screen animation is the first thing they turned it on for. One
    // frame, drawn once: the page keeps its picture and nothing moves.
    drawBackdrop(0);drawStrands(0);drawSeam(0);drawPackets(0,0);
  }
  addEventListener('pointermove',e=>{targetMX=(e.clientX/W-.5)*2;targetMY=(e.clientY/H-.5)*2},{passive:true});
  addEventListener('resize',()=>{resize();if(reduced)still();},{passive:true});
  resize();
  if(reduced) still(); else requestAnimationFrame(frame);
})();
</script>
</body></html>
