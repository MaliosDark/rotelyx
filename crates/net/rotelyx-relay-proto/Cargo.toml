optional = true

[dependencies.reloadable-state]
version = "0.1"
optional = true

[dependencies.reqwest]
version = "0.13"
features = ["rustls-no-provider"]
default-features = false

[dependencies.rustls]
version = "0.23.33"
default-features = false

[dependencies.rustls-cert-file-reader]
version = "0.4.2"
optional = true

[dependencies.rustls-cert-reloadable-resolver]
version = "0.7.1"
optional = true

[dependencies.rustls-platform-verifier]
version = "0.7.0"
optional = true

[dependencies.serde]
version = "1"
features = [
    "derive",
    "rc",
]

[dependencies.serde_bytes]
version = "0.11.17"

[dependencies.serde_json]
version = "1"
optional = true

[dependencies.sha1]
version = "0.11.0"
optional = true

[dependencies.simdutf8]
