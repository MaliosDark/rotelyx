features = ["rustls"]
default-features = false

[dependencies.rotelyx-quic-proto]
package = "rotelyx-quic-proto"
path = "../rotelyx-quic-proto"
default-features = false

[dependencies.num_enum]
version = "0.7"

[dependencies.pin-project]
version = "1"

