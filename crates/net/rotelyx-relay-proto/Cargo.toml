[workspace]

# THIS FILE IS AUTOMATICALLY GENERATED BY CARGO
#
# When uploading crates to the registry Cargo will automatically
# "normalize" Cargo.toml files for maximal compatibility
# with all versions of Cargo and also rewrite `path` dependencies
# to registry (e.g., crates.io) dependencies.
#
# If you are reading this file be aware that the original Cargo.toml
# will likely look very different (and much more reasonable).
# See Cargo.toml.orig for the original contents.

[package]
edition = "2024"
rust-version = "1.91"
name = "rotelyx-relay-proto"
version = "1.0.3"
authors = ["n0 team"]
build = "build.rs"
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "Rotelyx transport: relay client and server protocol"
keywords = [
    "networking",
    "holepunching",
    "p2p",
]
license = "(MIT OR Apache-2.0) AND BSD-3-Clause"
repository = "https://github.com/MaliosDark/rotelyx"
resolver = "2"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = [
    "--cfg",
    "rotelyx_docsrs",
]

[package.metadata.cargo_check_external_types]
allowed_external_types = [
    "rotelyx_transport_base::*",
    "rotelyx_discovery::*",
    "rotelyx_metrics::*",
    "rotelyx_error::*",
    "rotelyx_quic::*",
    "rotelyx_quic_proto::*",
    "bytes::*",
    "http::*",
    "http_body::*",
    "hyper::*",
    "rustls_pki_types::*",
    "serde_core::*",
    "tokio::*",
    "url::*",
    "rustls::*",
    "tokio_rustls::*",
    "futures_core::stream::Stream",
    "futures_sink::Sink",
]

[features]
default = [
    "metrics",
    "tls-ring",
]
metrics = ["rotelyx-metrics/metrics"]
platform-verifier = ["dep:rustls-platform-verifier"]
server = [
    "metrics",
    "tokio/signal",
    "dep:clap",
    "dep:dashmap",
    "dep:rcgen",
    "dep:reloadable-state",
    "dep:rustls-cert-file-reader",
    "dep:rustls-cert-reloadable-resolver",
    "dep:time",
    "dep:tokio-rustls-acme",
    "dep:tokio-websockets",
    "dep:simdutf8",
    "dep:sha1",
    "dep:toml",
    "dep:serde_json",
    "dep:tracing-subscriber",
    "rotelyx-quic/platform-verifier",
    "rotelyx-quic/runtime-tokio",
    "rotelyx-metrics/service",
    "tls-ring",
]
test-utils = []
tls-aws-lc-rs = [
    "rotelyx-quic/aws-lc-rs",
    "rustls/aws-lc-rs",
    "tokio-rustls/aws-lc-rs",
    "tokio-websockets/aws_lc_rs",
    "hickory-resolver/https-aws-lc-rs",
    "rotelyx-discovery/tls-aws-lc-rs",
]
tls-ring = [
    "rotelyx-quic/ring",
    "rustls/ring",
    "tokio-rustls/ring",
    "tokio-websockets/ring",
    "hickory-resolver/https-ring",
    "rotelyx-discovery/tls-ring",
]

[lib]
name = "rotelyx_relay_proto"
# Vendored upstream shipped a cdylib here for C consumers. Nothing in Rotelyx
# links this as a C library, and building both a rlib and a cdylib from one lib
# target makes them collide on one output filename under `cargo test
# --workspace`: whichever lands last wins and the other crates are then told the
# crate cannot be found.
crate-type = ["lib"]
path = "src/lib.rs"

[[bin]]
name = "rotelyx-relay-proto"
path = "src/main.rs"
required-features = ["server"]

[[test]]
name = "relay_axum"
path = "tests/relay_axum.rs"

[[test]]
name = "relay_hyper"
path = "tests/relay_hyper.rs"

[[test]]
name = "runtime_auth"
path = "tests/runtime_auth.rs"

[dependencies.rotelyx-status]
# The status strip, shared with the mailbox so the two cannot drift apart.
path = "../../rotelyx-status"

[dependencies.blake3]
version = "1.8.2"

[dependencies.bytes]
version = "1.11"

[dependencies.clap]
version = "4"
features = ["derive"]
optional = true

[dependencies.dashmap]
version = "6.1.0"
optional = true

[dependencies.data-encoding]
version = "2.6.0"

[dependencies.derive_more]
version = "2.0.1"
features = [
    "debug",
    "display",
    "from",
    "try_into",
    "deref",
]

[dependencies.http]
version = "1"

[dependencies.http-body-util]
version = "0.1.0"

[dependencies.hyper]
version = "1"
features = [
    "server",
    "client",
    "http1",
]

[dependencies.hyper-util]
version = "0.1.1"

[dependencies.rotelyx-transport-base]
package = "rotelyx-transport-base"
path = "../rotelyx-transport-base"
features = [
    "key",
    "relay",
]
default-features = false

[dependencies.rotelyx-discovery]
package = "rotelyx-discovery"
