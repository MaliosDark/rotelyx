[package]
name = "rotelyx-notifier"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
rotelyx-crypto = { path = "../rotelyx-crypto" }
rotelyx-push = { path = "../rotelyx-push" }

axum = "0.8"
tokio.workspace = true
serde.workspace = true
serde_json = "1"
data-encoding.workspace = true
subtle.workspace = true
zeroize.workspace = true
getrandom.workspace = true
clap.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
# The tests talk to the server over its real socket rather than calling into
# it, because what they assert is what it accepts from a caller.
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
