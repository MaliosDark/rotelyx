[package]
name = "rotelyx-wasm"
description = "Rotelyx cryptography compiled for the browser"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
rotelyx-core = { path = "../rotelyx-core", default-features = false }
rotelyx-crypto = { path = "../rotelyx-crypto", features = ["js"] }
rotelyx-mailbox = { path = "../rotelyx-mailbox" }

wasm-bindgen = "0.2"
js-sys = "0.3"
serde = { workspace = true }
serde_json = "1"
data-encoding.workspace = true
blake3.workspace = true
chacha20poly1305.workspace = true
argon2.workspace = true
zeroize.workspace = true
postcard.workspace = true
blind-rsa-signatures = "0.17"
getrandom = { workspace = true }

# Transitive crates still pull getrandom 0.2, which refuses to build for
# wasm32-unknown-unknown unless the `js` feature is on. Naming it here turns
# that feature on for the whole graph.
[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom_02 = { package = "getrandom", version = "0.2", features = ["js"] }
getrandom = { version = "0.4", features = ["wasm_js"] }
web-sys = { version = "0.3", features = ["console"] }
