[workspace]
resolver = "2"
# Vendored transport stack. Excluded from membership so upstream's own test
# suites and lint config do not run as part of Rotelyx's. See crates/net/README.md.
exclude = ["crates/net"]
members = [
    "crates/rotelyx-net",
    "crates/rotelyx-path",
    "crates/rotelyx-core",
    "crates/rotelyx-crypto",
    "crates/rotelyx-media",
    "crates/rotelyx-codec",
    "crates/rotelyx-mailbox",
    "crates/rotelyx-capability",
    "crates/rotelyx-audio",
    "crates/rotelyx-cli",
    "crates/rotelyx-relay",
    "crates/rotelyx-web",
    "crates/rotelyx-desktop",
    "crates/rotelyx-wasm",
    "crates/rotelyx-mobile",
    "crates/rotelyx-status",
    "crates/rotelyx-mailbox-client",
    "crates/rotelyx-mailbox-server",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "AGPL-3.0-only"
repository = "https://github.com/MaliosDark/rotelyx"
authors = ["Andryu Schittone"]

[workspace.dependencies]
# --- message crypto (L2) ---
# Versions pinned to what openmls 0.8.1 actually declares; the companion
# crates are on 0.5.x, not 0.4.x.
openmls = "0.8.1"
openmls_traits = "0.5"
openmls_basic_credential = "0.5"
openmls_memory_storage = "0.5"
# `openmls_libcrux_crypto` is the formally-verified provider and is the one we
# want long term; `openmls_rust_crypto` is the pragmatic default while the
# group plumbing is still moving.
openmls_rust_crypto = "0.5.1"

# --- post-quantum hybrid combiner (L2) ---
ml-kem = "0.3.2"
x25519-dalek = { version = "3", features = ["static_secrets"] }
ed25519-dalek = { version = "3", features = ["rand_core"] }

# --- symmetric / KDF (L2/L3) ---
blake3 = "1.8"
hkdf = "0.13"
sha2 = "0.11"
chacha20poly1305 = { version = "0.11", features = ["alloc"] }
argon2 = "0.5"
subtle = "2"
zeroize = { version = "1", features = ["zeroize_derive"] }

# --- serialization (L3 wire) ---
postcard = { version = "1", features = ["alloc"] }
serde = { version = "1", features = ["derive"] }
data-encoding = "2"

# --- runtime ---
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "io-util", "signal"] }
tokio-util = "0.7"
futures-lite = "2"
async-trait = "0.1"

# --- ops ---
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rand = "0.10"
rand_core = "0.10"
# Key generation goes straight to the OS CSPRNG rather than through a `rand`
# trait bound, so a future `rand` major bump cannot silently change how secret
# keys are produced. Matches iroh's own getrandom major.
getrandom = "0.4"
clap = { version = "4", features = ["derive"] }

# --- internal ---
rotelyx-net = { path = "crates/rotelyx-net" }
rotelyx-path = { path = "crates/rotelyx-path" }
rotelyx-codec = { path = "crates/rotelyx-codec" }
rotelyx-status = { path = "crates/rotelyx-status" }
rotelyx-core = { path = "crates/rotelyx-core" }
rotelyx-crypto = { path = "crates/rotelyx-crypto" }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"

# Secrets must not be optimised into leaked copies, and a debug build that is
# 100x slower makes the crypto tests unusable. Keep dependencies optimised
# even in dev.
[profile.dev.package."*"]
opt-level = 2

# The browser build is optimised for size rather than speed.
#
# It is downloaded before anything can happen, often on a phone on a cellular
# connection, and what it does there is seal and open messages a person typed:
# work measured in microseconds either way. A megabyte saved is a second of
# staring at a blank screen saved, and nobody can perceive the difference in
# how fast an ChaCha20 runs. That trade does not hold for the native build,
# which is why this is a separate profile rather than a change to `release`.
# The mobile library, where a panic must not take the host application with it.
#
# `release` aborts on panic, which is right for a binary we own: a process in an
# unknown state should stop. It is wrong for a `cdylib` loaded into somebody
# else's process, and it quietly disabled the guard at the FFI boundary. That
# entry point wraps the engine in `catch_unwind` and says a malformed input can
# crash a call rather than the process, and under `panic = "abort"` there is
# nothing to catch: the whole application goes.
#
# Unwinding costs some binary size and makes that promise true. Anything built
# from this profile must keep the `catch_unwind`, because unwinding across a C
# boundary without one is undefined behaviour.
[profile.mobile]
inherits = "release"
panic = "unwind"

[profile.wasm]
inherits = "release"
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
