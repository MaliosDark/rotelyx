# The static site and the browser client, nginx.
#
# OPERATOR is the account the site lives under. Substitute your own. Written
# with a placeholder rather than a real account because these files are
# published, and a config naming a real user and directory hands an attacker
# the layout of the machine before they have looked at it.
#
# ---------------------------------------------------------------------------
# WHY THIS FILE EXISTS
# ---------------------------------------------------------------------------
#
# The block below was recommended in `docs/BROWSER.md` and written by hand on
# the server, with `root` where it needed `alias`. That took the browser client
# down for six days, and nothing in this repository could have caught it,
# because the only copy of it was on the machine.
#
# The relay's config is here for the same reason. A configuration that matters
# and lives in one place is a configuration nobody can review.

# ===========================================================================
# Goes in the `server` block for the site, in BOTH the :80 and :443 variants
# ===========================================================================

	# The WebAssembly engine.
	#
	# Two things this fixes, and one trap.
	#
	# **The type.** Served as anything but `application/wasm`, the browser
	# refuses the streaming compile and falls back to a slower path, with only
	# a console warning to say why.
	#
	# **The cache.** CWP serves `.wasm` with `expires max`, which Cloudflare
	# honours for ten years. A new build is uploaded, nobody asks for it again,
	# and the page runs old code for ever. `scripts/build-wasm` also stamps a
	# hash into the URL the page requests, so the two protections are
	# independent: either alone would do, and neither is a reason to skip the
	# other.
	#
	# **`alias`, not `root`, and the trailing slash is required.** `root`
	# appends the whole request URI to the path it is given, so
	# `root /home/OPERATOR/public_html/rotelyx` sends a request for
	# `/rotelyx/rotelyx_wasm.js` looking in
	# `public_html/rotelyx/rotelyx/rotelyx_wasm.js`, which does not exist.
	# `alias` replaces the matched prefix instead. Deployed with `root` on
	# 23 August 2026 and found on the 29th: every upload to that directory was
	# ignored, the site served a six-day-old module and then 404ed, and the
	# page stopped loading entirely, because an ES module import of a name the
	# module does not export is a SyntaxError before a line of it runs.
	location /rotelyx/ {
		alias /home/OPERATOR/public_html/rotelyx/;

		types {
			application/wasm  wasm;
			text/javascript   js;
		}

		add_header Cache-Control "no-cache";
	}

# ---------------------------------------------------------------------------
# After changing this
# ---------------------------------------------------------------------------
#
#   nginx -t && systemctl reload nginx
#   scripts/verify-deployment https://rotelyx.com
#
# The second one is not optional and it is not the same check as the first.
# nginx will happily load a block that points at nothing: `nginx -t` says the
# syntax is valid, and a request for a file that is really there answers 404.
# `verify-deployment` asks from outside whether the page and the module it
# loads are the same build, which is the question that was being got wrong.

# ===========================================================================
# App links, so an invitation opens the application instead of a browser
# ===========================================================================
#
# Two files under `/.well-known/` say that this domain and the applications
# belong together. Android reads `assetlinks.json` and iOS reads
# `apple-app-site-association`, and both are fetched by the operating system
# rather than by anything a person sees, so a mistake here is silent: the link
# simply opens a browser and nobody is told why.
#
# **The Apple file has no extension.** That is the name Apple requires, and a
# server that guesses a type from an extension has none to guess from and sends
# `application/octet-stream`. iOS wants JSON and rejects anything else without
# saying so.
#
# **Neither may redirect.** Apple follows no redirect at all when fetching the
# association, so an http to https redirect, a www to apex redirect, or a
# trailing slash rule that touches these two is the whole feature not working.
#
# **They must be reachable over plain https on the apex.** The one the phone
# asks for is `https://rotelyx.com/.well-known/...`, whatever the site does
# with www.
	location = /.well-known/apple-app-site-association {
		default_type application/json;
		add_header Cache-Control "public, max-age=3600";
	}

	location = /.well-known/assetlinks.json {
		default_type application/json;
		add_header Cache-Control "public, max-age=3600";
	}

# The Android file needs the fingerprint Google Play signs with, and that is
# not the upload key.
#
# Play re-signs every upload with a key it holds, so the certificate on the
# installed application is Google's and not the one the bundle was uploaded
# with. The file currently carries the upload key, which is what a build
# installed by hand is signed with and is right for testing on a device.
#
# Until the Play fingerprint is added, a link on Android 12 or later opens the
# browser instead of the application: an unverified link is not offered to an
# app at all any more, and there is no prompt saying so. It lands on `/i`,
# which exists and says where to get the app, so it degrades to a page rather
# than to an error.
#
# Play Console, App integrity, App signing, SHA-256. Both fingerprints belong
# in the array: one for what Play installs and one for what a developer
# installs.


# The invitation page itself.
#
# `/i` is reached only by somebody who does not have the application: a phone
# that has it opens the app and never makes this request. So the page exists to
# say where to get it, and carries nothing else.
#
# The invitation is in the fragment, which a browser never sends, so this
# server is asked for `/i` and learns nothing about who is inviting whom. That
# is the property the whole link design rests on, and it is why there is no
# lookup here and no short link resolving to anything.
	location = /i {
		try_files /i.html =404;
	}
