# The static site and the browser client, nginx.
#
# OPERATOR is the account the site lives under. Substitute your own. Written
# with a placeholder rather than a real account because these files are
# published, and a config naming a real user and directory hands an attacker
# the layout of the machine before they have looked at it.
#
# ---------------------------------------------------------------------------
# WHY THIS FILE EXISTS
# ---------------------------------------------------------------------------
#
# The block below was recommended in `docs/BROWSER.md` and written by hand on
# the server, with `root` where it needed `alias`. That took the browser client
# down for six days, and nothing in this repository could have caught it,
# because the only copy of it was on the machine.
#
# The relay's config is here for the same reason. A configuration that matters
# and lives in one place is a configuration nobody can review.

# ===========================================================================
# Goes in the `server` block for the site, in BOTH the :80 and :443 variants
# ===========================================================================

	# The WebAssembly engine.
	#
	# Two things this fixes, and one trap.
	#
	# **The type.** Served as anything but `application/wasm`, the browser
	# refuses the streaming compile and falls back to a slower path, with only
	# a console warning to say why.
	#
	# **The cache.** CWP serves `.wasm` with `expires max`, which Cloudflare
	# honours for ten years. A new build is uploaded, nobody asks for it again,
	# and the page runs old code for ever. `scripts/build-wasm` also stamps a
	# hash into the URL the page requests, so the two protections are
	# independent: either alone would do, and neither is a reason to skip the
	# other.
	#
	# **`alias`, not `root`, and the trailing slash is required.** `root`
	# appends the whole request URI to the path it is given, so
	# `root /home/OPERATOR/public_html/rotelyx` sends a request for
	# `/rotelyx/rotelyx_wasm.js` looking in
	# `public_html/rotelyx/rotelyx/rotelyx_wasm.js`, which does not exist.
	# `alias` replaces the matched prefix instead. Deployed with `root` on
	# 23 August 2026 and found on the 29th: every upload to that directory was
	# ignored, the site served a six-day-old module and then 404ed, and the
	# page stopped loading entirely, because an ES module import of a name the
	# module does not export is a SyntaxError before a line of it runs.
	location /rotelyx/ {
		alias /home/OPERATOR/public_html/rotelyx/;

		types {
			application/wasm  wasm;
			text/javascript   js;
		}

		add_header Cache-Control "no-cache";
	}

# ---------------------------------------------------------------------------
# After changing this
# ---------------------------------------------------------------------------
#
#   nginx -t && systemctl reload nginx
#   scripts/verify-deployment https://rotelyx.com
#
# The second one is not optional and it is not the same check as the first.
# nginx will happily load a block that points at nothing: `nginx -t` says the
# syntax is valid, and a request for a file that is really there answers 404.
# `verify-deployment` asks from outside whether the page and the module it
# loads are the same build, which is the question that was being got wrong.
