# RELAY_HOST and NGINX_HOST are placeholders for the operator's own LAN
# addresses. Substitute your own before use. They are not real values here
# because a private address tells a reader how the operator's network is laid
# out, and this file is committed.
# Rotelyx relay, nginx front end.
#
# Two parts. The rate limit zones must go in the `http` block, and the location
# blocks inside the `server` block for amber.telyx.me, in BOTH the :80
# and the :443 variants.
#
# ---------------------------------------------------------------------------
# THIS FILE IS AN OPTIONAL EXTRA, NOT THE LIMIT
# ---------------------------------------------------------------------------
#
# Read this before assuming any of it is running.
#
# These directives were written, deployed, and rejected by the control panel.
# Twice. They were removed from the live configuration and this file went on
# describing them, so the documents claimed a guarantee nothing enforced.
# Measured on 18 August 2026 and again on 23 August: dozens of requests in a few
# seconds, dozens of answers, not one refusal.
#
# The limits now live inside both servers, where they are present in every
# deployment rather than in a file most operators will never write:
#
#   rotelyx-relay::limits            keyed on the endpoint identity, which the
#                                    relay handshake proves before access
#                                    control is asked
#   rotelyx-mailbox-server::limits   keyed on the source address, because a
#                                    socket that deposits nothing never presents
#                                    an identity, and that is the caller being
#                                    bounded
#
# What nginx can still add, if it will accept the directives, is refusing before
# the TLS handshake completes. That is a real saving and it is the only reason
# to keep this file: an unauthorised peer otherwise forces a full handshake
# before anything refuses it, and nginx terminates TLS here so nginx pays for it.
# It is an optimisation on top of the in-process limits, not a substitute.
#
# Behind a proxy, the mailbox needs `--trusted-proxy <this nginx's address>` or
# it will see every connection as coming from nginx and put every user in one
# bucket.
#
# ---------------------------------------------------------------------------
# Why rate limiting rather than a challenge
# ---------------------------------------------------------------------------
#
# The relay's clients are programs, not browsers. A captcha needs a human and a
# DOM, so hCaptcha and anything like it cannot apply here even self hosted.


# ===========================================================================
# PART 1: goes in the `http` block
# ===========================================================================

# Connections in flight per source address. A legitimate client opens one relay
# connection and keeps it. Ten leaves room for a shared NAT without leaving the
# door open to a flood.
limit_conn_zone $binary_remote_addr zone=rotelyx_conn:10m;

# New connection attempts per second. Relay sessions are long lived, so a
# client that reconnects more than a few times a minute is either broken or
# hostile. The burst absorbs a genuine reconnect storm after a network blip.
limit_req_zone $binary_remote_addr zone=rotelyx_req:10m rate=10r/m;

# Log refusals at warn so a flood is visible without turning on debug.
limit_conn_log_level warn;
limit_req_log_level  warn;

# Answer 429 rather than the default 503. A rate limited client should be told
# to slow down, not told the service is unavailable.
limit_conn_status 429;
limit_req_status  429;


# ===========================================================================
# PART 2: goes in the `server` block, before `location /`
# ===========================================================================

	# The relay WebSocket endpoint.
	#
	# proxy.inc is deliberately not included: the upgrade needs HTTP/1.1 and
	# its own headers, and any inherited setting that pins the version or
	# rewrites Connection breaks it silently.
	location /relay {
		limit_conn rotelyx_conn 10;
		limit_req  zone=rotelyx_req burst=20 nodelay;

		proxy_pass http://RELAY_HOST:3340;

		proxy_http_version 1.1;
		proxy_set_header Upgrade    $http_upgrade;
		proxy_set_header Connection "upgrade";
		proxy_set_header Host       $host;
		proxy_set_header X-Real-IP  $remote_addr;
		proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;

		# Relay sessions last hours. The default 60 second timeout would cut
		# every conversation with no error visible to the client.
		proxy_read_timeout  7d;
		proxy_send_timeout  7d;

		# A relay forwards in real time. Buffering only adds latency.
		proxy_buffering off;
		proxy_cache off;
	}

	# Health probe. Plain HTTP, no upgrade, cheap enough to leave uncapped
	# but not worth logging.
	location = /ping {
		proxy_pass http://RELAY_HOST:3340;
		proxy_set_header Host $host;
		access_log off;
	}

	# The landing page. Served by the relay itself and fully self contained,
	# so it can be cached hard at the edge and never touches the backend
	# again for a casual visitor.
	location = / {
		limit_req zone=rotelyx_req burst=5 nodelay;
		proxy_pass http://RELAY_HOST:3340;
		proxy_set_header Host $host;
		expires 1h;
	}
