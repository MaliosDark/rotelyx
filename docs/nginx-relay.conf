# Rotelyx relay, nginx front end.
#
# Two parts. The rate limit zones must go in the `http` block, and the location
# blocks inside the `server` block for relay-rotelyx.ideoa.co, in BOTH the :80
# and the :443 variants.
#
# ---------------------------------------------------------------------------
# Why rate limiting rather than a challenge
# ---------------------------------------------------------------------------
#
# The relay's clients are programs, not browsers. A captcha needs a human and a
# DOM, so hCaptcha and anything like it cannot apply here even self hosted.
#
# The real exposure is that an unauthorised peer forces a full TLS handshake
# before the allowlist refuses it. nginx terminates TLS in this deployment, so
# nginx pays that cost and nginx is where it must be capped. A limit applied
# inside the relay would fire after the expensive part had already happened.


# ===========================================================================
# PART 1: goes in the `http` block
# ===========================================================================

# Connections in flight per source address. A legitimate client opens one relay
# connection and keeps it. Ten leaves room for a shared NAT without leaving the
# door open to a flood.
limit_conn_zone $binary_remote_addr zone=rotelyx_conn:10m;

# New connection attempts per second. Relay sessions are long lived, so a
# client that reconnects more than a few times a minute is either broken or
# hostile. The burst absorbs a genuine reconnect storm after a network blip.
limit_req_zone $binary_remote_addr zone=rotelyx_req:10m rate=10r/m;

# Log refusals at warn so a flood is visible without turning on debug.
limit_conn_log_level warn;
limit_req_log_level  warn;

# Answer 429 rather than the default 503. A rate limited client should be told
# to slow down, not told the service is unavailable.
limit_conn_status 429;
limit_req_status  429;


# ===========================================================================
# PART 2: goes in the `server` block, before `location /`
# ===========================================================================

	# The relay WebSocket endpoint.
	#
	# proxy.inc is deliberately not included: the upgrade needs HTTP/1.1 and
	# its own headers, and any inherited setting that pins the version or
	# rewrites Connection breaks it silently.
	location /relay {
		limit_conn rotelyx_conn 10;
		limit_req  zone=rotelyx_req burst=20 nodelay;

		proxy_pass http://192.168.68.46:3340;

		proxy_http_version 1.1;
		proxy_set_header Upgrade    $http_upgrade;
		proxy_set_header Connection "upgrade";
		proxy_set_header Host       $host;
		proxy_set_header X-Real-IP  $remote_addr;
		proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;

		# Relay sessions last hours. The default 60 second timeout would cut
		# every conversation with no error visible to the client.
		proxy_read_timeout  7d;
		proxy_send_timeout  7d;

		# A relay forwards in real time. Buffering only adds latency.
		proxy_buffering off;
		proxy_cache off;
	}

	# Health probe. Plain HTTP, no upgrade, cheap enough to leave uncapped
	# but not worth logging.
	location = /ping {
		proxy_pass http://192.168.68.46:3340;
		proxy_set_header Host $host;
		access_log off;
	}

	# The landing page. Served by the relay itself and fully self contained,
	# so it can be cached hard at the edge and never touches the backend
	# again for a casual visitor.
	location = / {
		limit_req zone=rotelyx_req burst=5 nodelay;
		proxy_pass http://192.168.68.46:3340;
		proxy_set_header Host $host;
		expires 1h;
	}
