name: Bug report
description: Something behaves differently from what the documentation says
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        **If this is a security problem, close this form and email
        contact@ideoa.co.uk instead.** A public issue is a working exploit
        handed to everybody who reads the repository. See
        [SECURITY.md](../blob/master/SECURITY.md).
  - type: checkboxes
    id: not-security
    attributes:
      label: This is not a security problem
      options:
        - label: >-
            I have read SECURITY.md and this report does not describe a way to
            read, forge, or link somebody else's messages, keys or metadata.
          required: true
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what you got instead.
    validations:
      required: true
  - type: input
    id: build
    attributes:
      label: Which build
      description: A commit hash, or the version a client shows.
  - type: textarea
    id: repro
    attributes:
      label: How to reproduce it
      description: Commands, a failing test, or the steps in the interface.
