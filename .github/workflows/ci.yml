name: ci

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always
  # The vendored transport is large. One job per core exhausts memory on a
  # standard runner, and the failure looks like a mysterious kill rather than
  # an out of memory error.
  CARGO_BUILD_JOBS: 2

jobs:
  # Runs first and on its own, because this is the check that must never be
  # skipped or buried under a compile failure in something unrelated.
  no-foreign-infrastructure:
    name: contacts no third party infrastructure
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: guard
        run: cargo test -p rotelyx-net --test no_foreign_infrastructure -- --nocapture

      - name: no upstream transport package is resolved
        run: |
          # A clone must build without fetching anything from a third party
          # registry. If this ever finds something, the vendoring has leaked.
          found=$(cargo metadata --format-version 1 \
            | python3 -c "
          import sys, json
          d = json.load(sys.stdin)
          bad = sorted({p['name'] for p in d['packages']
                        if p['name'].startswith(('iroh','noq','n0-','netwatch','portmapper','pkarr'))})
          print(' '.join(bad))
          ")
          if [ -n "$found" ]; then
            echo "upstream transport packages resolved: $found" >&2
            exit 1
          fi
          echo "no upstream transport packages resolved"

  test:
    name: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace

  transport:
    # `cargo test --workspace` cannot reach crates/net: it is excluded from
    # membership so upstream's lint config does not become ours. That was fine
    # while the vendored code was only vendored. It is not fine now that we
    # write in it: alias binding and the circuit frames are ours and live
    # there. A subprotocol negotiation test sat broken in that crate through a
    # rename because nothing ran it, so this job runs it.
    name: vendored transport
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --all-features --manifest-path crates/net/rotelyx-relay-proto/Cargo.toml

  transport:
    # 107 tests in the vendored transport that had never compiled, let alone
    # run. Thirty three of them named `presets::N0`, a preset this tree deleted
    # on purpose because it registered infrastructure operated by somebody
    # else, and one resolved that operator's DNS name and asserted it answered.
    # Nothing said so, because nothing ran them.
    name: vendored transport, unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: |
          cargo test --manifest-path crates/net/rotelyx-transport/Cargo.toml --lib

  nat:
    # Hole punching, which this project is built around and had never once
    # exercised. Forty six tests in simulated network topologies: NATs of every
    # hardness, a hard NAT that becomes punchable, an uplink that switches
    # between v4 and v6, a link that goes down and comes back, degraded links.
    #
    # They were unrunnable, not missing. The manifest asked `patchbay` for a
    # feature named `rotelyx-metrics`, which is not a feature it has: the rename
    # that made this tree's crates Rotelyx's renamed one belonging to somebody
    # else's crate, and the package stopped resolving. Nothing said so except a
    # resolver error nobody was reading, because nothing ran these.
    #
    # One of them failed once in four runs, which is what a simulated network
    # does. If this job goes red on a rerun that passed, that is the first thing
    # to suspect.
    name: nat traversal
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: |
          cargo test --manifest-path crates/net/rotelyx-transport/Cargo.toml \
            --test patchbay

  chain:
    # The only thing that covers a relay dialling another relay. Everything
    # else about chaining runs inside one process, and the seam between the
    # dialler and the TLS stack is exactly where the first defect was: the
    # dialler asked for a crypto provider nothing installs, so every dial would
    # have failed in production while every in-process test passed.
    name: a circuit through two relays
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: ./scripts/chain-test

  lint:
    name: format and clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2

      # Only our own crates. The vendored tree carries upstream's style and
      # reformatting it would turn every future patch import into a conflict.
      - name: fmt
        run: cargo fmt --check -p rotelyx-core -p rotelyx-crypto -p rotelyx-mailbox
             -p rotelyx-net -p rotelyx-cli -p rotelyx-relay -p rotelyx-web

      - name: clippy
        run: cargo clippy -p rotelyx-core -p rotelyx-crypto -p rotelyx-mailbox
             -p rotelyx-net -p rotelyx-relay -- -D warnings

  vectors:
    name: post quantum vectors reproduce
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      # The published vectors are the artefact an external reviewer checks
      # against. If they stop reproducing, either the construction changed or
      # the file is stale, and both are protocol breaks.
      - run: cargo test -p rotelyx-crypto --test pq_vectors
