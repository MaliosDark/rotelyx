name: ci

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always
  # The vendored transport is large. One job per core exhausts memory on a
  # standard runner, and the failure looks like a mysterious kill rather than
  # an out of memory error.
  CARGO_BUILD_JOBS: 2

jobs:
  # Runs first and on its own, because this is the check that must never be
  # skipped or buried under a compile failure in something unrelated.
  no-foreign-infrastructure:
    name: contacts no third party infrastructure
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: guard
        run: cargo test -p rotelyx-net --test no_foreign_infrastructure -- --nocapture

      - name: no upstream transport package is resolved
        run: |
          # A clone must build without fetching anything from a third party
          # registry. If this ever finds something, the vendoring has leaked.
          found=$(cargo metadata --format-version 1 \
            | python3 -c "
          import sys, json
          d = json.load(sys.stdin)
          bad = sorted({p['name'] for p in d['packages']
                        if p['name'].startswith(('iroh','noq','n0-','netwatch','portmapper','pkarr'))})
          print(' '.join(bad))
          ")
          if [ -n "$found" ]; then
            echo "upstream transport packages resolved: $found" >&2
            exit 1
          fi
          echo "no upstream transport packages resolved"

  test:
    name: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace

  relay-proto:
    # `cargo test --workspace` cannot reach crates/net: it is excluded from
    # membership so upstream's lint config does not become ours. That was fine
    # while the vendored code was only vendored. It is not fine now that we
    # write in it: alias binding and the circuit frames are ours and live
    # there. A subprotocol negotiation test sat broken in that crate through a
    # rename because nothing ran it, so this job runs it.
    #
    # This job was called `transport`, and so was the one below it. YAML keeps
    # the last of two identical keys, so **this one did not exist**: the file
    # listed ten jobs and nine ran. The 117 tests of the crate that carries the
    # relay wire format were not among them, in a repository whose README says
    # every crate here has a CI job. A duplicate key is silent in exactly the
    # way the jobs below exist to prevent.
    name: relay protocol
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --all-features --manifest-path crates/net/rotelyx-relay-proto/Cargo.toml

  advisories:
    # `scripts/audit-dependencies` against the RustSec database. It exits
    # non-zero when an advisory is unreviewed, or when `deny.toml`,
    # `.cargo/audit.toml` and its ledger stop agreeing, which is the case
    # somebody has to look at rather than a number to watch drift upwards.
    #
    # Not in CI before, so an advisory published against any of the 722
    # packages here arrived only when somebody thought to run it.
    name: dependency advisories
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: python3 scripts/audit-dependencies

  vendored:
    # Every vendored crate's own tests. None of them ran, because
    # `cargo test --workspace` cannot reach an excluded crate and nothing else
    # asked. That was defensible while this code was only vendored; it is not
    # now that this tree writes in it, and it hid three separate breakages that
    # had been there since the rename:
    #
    #   - 33 uses of `presets::N0`, a preset deleted here on purpose because it
    #     registered infrastructure operated by somebody else
    #   - a test that resolved that operator's DNS name and asserted it answered
    #   - `endpoint_info_from_attrs`, the DNS TXT encoding deleted with the rest
    #     of address publication, still called by three tests and one of them
    #     left half written
    #
    # 528 of these are the QUIC state machine and the layers under it. Nothing
    # in this tree verified any of it.
    name: vendored crates
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        crate:
          - rotelyx-transport-base
          - rotelyx-future
          - rotelyx-watcher
          - rotelyx-error
          - rotelyx-discovery
          - rotelyx-quic-udp
          - rotelyx-netwatch
          - rotelyx-metrics
          - rotelyx-quic
          - rotelyx-quic-proto
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: |
          cargo test --manifest-path crates/net/${{ matrix.crate }}/Cargo.toml

  transport:
    name: vendored transport, unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: |
          cargo test --manifest-path crates/net/rotelyx-transport/Cargo.toml --lib

  nat:
    # Hole punching, which this project is built around and had never once
    # exercised. Forty six tests in simulated network topologies: NATs of every
    # hardness, a hard NAT that becomes punchable, an uplink that switches
    # between v4 and v6, a link that goes down and comes back, degraded links.
    #
    # They were unrunnable, not missing. The manifest asked `patchbay` for a
    # feature named `rotelyx-metrics`, which is not a feature it has: the rename
    # that made this tree's crates Rotelyx's renamed one belonging to somebody
    # else's crate, and the package stopped resolving. Nothing said so except a
    # resolver error nobody was reading, because nothing ran these.
    #
    # One of them fails now and then, which is what a simulated network does:
    # these build topologies in user namespaces and time real packets through
    # them. So the job runs the suite twice before calling it a failure, and
    # says which attempt it was on.
    #
    # **Retried once, not until it passes.** A retry loop with no bound turns a
    # test that fails half the time into one that always passes, and the number
    # of attempts is printed so that a suite which starts needing the second one
    # every time is visible rather than quietly tolerated.
    #
    # A red gate that nobody believes is worse than no gate, which is why this
    # is here and not a paragraph explaining the flake.
    name: nat traversal
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: |
          set -o pipefail
          run() {
            cargo test --manifest-path crates/net/rotelyx-transport/Cargo.toml \
              --test patchbay
          }
          if run; then
            echo "nat traversal: passed first time"
          else
            echo "nat traversal: first attempt failed, running once more" >&2
            if run; then
              echo "nat traversal: passed on the second attempt" >&2
              echo "That is the simulation, not the code, unless it keeps" >&2
              echo "happening: a suite that needs the retry every time is a" >&2
              echo "suite that is telling you something." >&2
            else
              echo "nat traversal: failed twice, which is not the simulation" >&2
              exit 1
            fi
          fi

  chain:
    # The only thing that covers a relay dialling another relay. Everything
    # else about chaining runs inside one process, and the seam between the
    # dialler and the TLS stack is exactly where the first defect was: the
    # dialler asked for a crypto provider nothing installs, so every dial would
    # have failed in production while every in-process test passed.
    name: a circuit through two relays
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: ./scripts/chain-test

  timing:
    # The codec has to fit in a fraction of one core or a call does not run.
    # That bound cannot be asserted inside `cargo test --workspace`, which runs
    # test binaries in parallel on purpose: the same gate measured 14.6% of its
    # bound alone and 41% in a contended run. Resampling did not fix it in
    # either direction, long or short.
    #
    # So it runs here, alone, with nothing else on the machine, and it is
    # `#[ignore]` everywhere else. A gate that fails when the machine is busy
    # gets ignored by people, which is worse than one that runs in one place
    # and means it.
    name: the codec fits in a fraction of a core
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: |
          # `release-test`, not `release`: the release profile is panic=abort
          # and a test harness needs unwind. See the profile in Cargo.toml.
          cargo test -p rotelyx-codec --profile release-test --lib -- \
            --ignored --test-threads=1 --nocapture real_time

  lint:
    name: format and clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2

      # Our own crates, asked for by name, with the names coming from cargo
      # rather than from a list somebody has to remember to update.
      #
      # This used to name seven crates by hand and the list fell behind as the
      # workspace grew. `--all` is not the fix: **`cargo fmt --all` reaches
      # `crates/net`**, following the path dependency into the vendored tree,
      # and reformatting upstream's style would turn every future patch import
      # into a conflict. `cargo metadata --no-deps` lists workspace members
      # only, and `crates/net` is excluded from membership, so this covers
      # everything of ours and nothing of theirs by construction.
      - name: fmt
        run: |
          cargo fmt --check $(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[].name | "-p \(.)"')

      # `--workspace` is safe here where `--all` was not: cargo's workspace is
      # the nineteen members, and `crates/net` is excluded from it. That tree
      # has its own jobs above.
      #
      # `--all-targets`, so tests are linted too. They were not, which is how a
      # test whose whole body was `assert!(MAX_DEVICES > 0)` sat in the wake
      # registry calling itself a bound.
      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

  vectors:
    name: post quantum vectors reproduce
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      # The published vectors are the artefact an external reviewer checks
      # against. If they stop reproducing, either the construction changed or
      # the file is stale, and both are protocol breaks.
      - run: cargo test -p rotelyx-crypto --test pq_vectors
